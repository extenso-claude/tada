# Cog config for self-hosting HumeAI/tada on Replicate.
#
# Deployment is via GitHub Actions — pushing to main triggers
# .github/workflows/push.yml which runs `cog push r8.im/extenso-claude/tada-voice`
# with HF_TOKEN as a build-time secret. The Llama-3.2-licensed TADA + tada-codec
# weights are downloaded INTO the image during build so the runtime container
# never needs HF_TOKEN.
#
# Model: extenso-claude/tada-voice (Private, Nvidia L40S)
# Image size after build: ~12-15 GB (Llama 3.2 3B in bf16 + codec)
# First cold start: ~1-2 min (loading weights from local image disk)
build:
  gpu: true
  cuda: "12.4"
  python_version: "3.11"
  system_packages:
    - "ffmpeg"
    - "libsndfile1"
    - "git"
  python_packages:
    # hume-tada requires torch>=2.7.0,<2.8.0 and transformers>=4.57.1
    - "torch==2.7.1"
    - "torchaudio==2.7.1"
    - "transformers>=4.57.1,<5"
    - "huggingface_hub>=0.25.0"
    - "hume-tada"
    - "soundfile"
  run:
    # Bake gated HumeAI/tada weights into the image at build time.
    # The HF_TOKEN secret is passed via `cog push --secret HF_TOKEN=...`
    # (set up by the GitHub Action). After build, the weights live in
    # /root/.cache/huggingface and the runtime never needs the token.
    # Cog requires each shell command to be a single line — using
    # huggingface-cli (installed by the huggingface_hub pip package).
    - command: HF_HUB_DOWNLOAD_TIMEOUT=600 huggingface-cli download HumeAI/tada-codec --token "$(cat /run/secrets/HF_TOKEN)"
      mounts:
        - type: secret
          id: HF_TOKEN
          target: /run/secrets/HF_TOKEN
    - command: HF_HUB_DOWNLOAD_TIMEOUT=600 huggingface-cli download HumeAI/tada-3b-ml --token "$(cat /run/secrets/HF_TOKEN)"
      mounts:
        - type: secret
          id: HF_TOKEN
          target: /run/secrets/HF_TOKEN

predict: "predict.py:Predictor"
